name: Build Python Image to GHCR

on:
  push:
    branches: [ main ]
    paths:
      - 'python/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # 允许工作流向 GHCR 推送镜像

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6

    # 1. 登录到 GitHub Container Registry (GHCR)
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 2. 提取镜像标签元数据
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/sbx-python  # 镜像名称，你可以改成自己喜欢的名字
        tags: |
          latest
          type=sha,format=short

    # 3. 基于 python 目录下的 Dockerfile 构建并推送镜像
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./python          # 指定上下文为 python 文件夹
        file: ./python/Dockerfile  # 指定 Dockerfile 路径
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
